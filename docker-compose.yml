name: cardiolens

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; health=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); sys.exit(0 if health.get('status') == 'healthy' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${CARDIOLENS_PORT:-8080}:80"
