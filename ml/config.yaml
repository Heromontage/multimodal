# CardioLens ML Configuration
targets:
  - CAD
  - LAD
  - LCX
  - RCA

data_file: file.csv

excluded_cols: [LAD, LCX, RCA, Cath]  # Target leakage prevention

random_seeds:
  global: 42
  cv_inner: 123
  cv_outer: 456

# Model configurations
models:
  logistic_regression:
    penalty: l2
    C: 1.0
    solver: liblinear
    max_iter: 1000
    class_weight: balanced

  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: balanced
    random_state: 42

  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    objective: binary:logistic
    eval_metric: logloss
    scale_pos_weight: 1  # Will be computed per target
    random_state: 42

  # Temporarily disable LightGBM to avoid optimization issues
  # lightgbm:
  #   n_estimators: 100
  #   max_depth: 6
  #   learning_rate: 0.1
  #   subsample: 0.8
  #   colsample_bytree: 0.8
  #   objective: binary
  #   metric: binary_logloss
  #   is_unbalance: true
  #   random_state: 42

# Cross-validation
cv:
  outer_splits: 5
  outer_repeats: 5
  inner_splits: 5
  stratified: true

# Hyperparameter search
optuna:
  n_trials: 1  # Further reduced for quick testing
  timeout: 30

# Calibration
calibration:
  method: sigmoid  # or isotonic
  cv: 3

# SHAP
shap:
  background_size: 10  # Further reduced for quick testing
  nsamples: 50
